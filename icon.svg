<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <rect width="128" height="128" rx="16" fill="#181a1f"/>
  <!-- CRT Bezel -->
  <rect x="14" y="12" width="100" height="82" rx="8" fill="#c8c4b8" stroke="#8a867a" stroke-width="3"/>
  <!-- CRT Screen -->
  <rect x="22" y="20" width="84" height="62" rx="4" fill="#0d261a" stroke="#3a3832" stroke-width="2"/>
  <!-- Terminal Prompt -->
  <text x="28" y="38" font-family="monospace" font-size="11" font-weight="bold" fill="#33ff66">&gt; RETRO_OS</text>
  <text x="28" y="54" font-family="monospace" font-size="9" fill="#22cc55">640K RAM OK</text>
  <rect x="28" y="62" width="8" height="12" fill="#33ff66"/>
  <!-- Power LED -->
  <circle cx="102" cy="88" r="3" fill="#33ff33"/>
  <!-- Monitor Stand -->
  <path d="M46 94 L82 94 L88 106 L40 106 Z" fill="#a8a498" stroke="#787468" stroke-width="2"/>
  <rect x="26" y="106" width="76" height="10" rx="2" fill="#c8c4b8" stroke="#8a867a" stroke-width="2"/>
  <!-- Floppy Slot -->
  <rect x="68" y="110" width="26" height="3" fill="#2b2b2b"/>
</svg>

